[project]
name = "padel"
version = "0.1.0"
description = "Padel court booking platform with waitlist and split payments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2>=2.13",  # TestClient transport (starlette >= 1.x prefers httpx2 over httpx)
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["padel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real database (TEST_DATABASE_URL); runs in the CI integration job",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["padel"]
omit = ["padel/infrastructure/db/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["padel/infrastructure/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["padel"]
exclude = ["padel/infrastructure/db/migrations/"]
plugins = ["pydantic.mypy"]

[tool.coverage.report]
fail_under = 85
show_missing = true
