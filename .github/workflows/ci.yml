name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------
  # (a) Fast feedback: lint, types, unit/application tests (in-memory fakes + FakeClock),
  #     API tests and repository contract tests on SQLite. No external services.
  # ------------------------------------------------------------------------------------
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Unit, API and SQLite tests
        run: pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # ------------------------------------------------------------------------------------
  # (b) Integration tests against a real PostgreSQL, the production database.
  #
  # Why SQLite alone is not enough (SQLite vs. PostgreSQL differences that matter here):
  # - Partial indexes: both support `CREATE UNIQUE INDEX ... WHERE status IN (...)`
  #   (ADR 001), but only PostgreSQL gives us real concurrent transactions. The race
  #   between two bookings (tests/integration/test_double_booking.py) can only be
  #   reproduced here; SQLite serialises writers with a file lock.
  # - Timestamps / time zones: PostgreSQL `timestamptz` stores an instant and returns
  #   aware datetimes. SQLite has no time zone type and returns naive datetimes; our
  #   UTCDateTime column type normalises both to aware UTC (models.py). The contract
  #   tests check the round trip on both backends.
  # - Types: SQLite stores NUMERIC as float and does not enforce VARCHAR lengths;
  #   PostgreSQL is strict. The Money type re-quantizes to 0.01 on read.
  # - Constraint error messages differ (index name vs. column name), which matters
  #   when translating IntegrityError into SlotUnavailableError.
  # - Migrations: SQLite needs batch mode for ALTER TABLE; only running Alembic against
  #   PostgreSQL proves the migrations work in production.
  # ------------------------------------------------------------------------------------
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: padel
          POSTGRES_PASSWORD: padel
          POSTGRES_DB: padel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U padel -d padel_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://padel:padel@localhost:5432/padel_test
      TEST_DATABASE_URL: postgresql://padel:padel@localhost:5432/padel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly (upgrade, downgrade, upgrade)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Integration tests
        run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
